[build]
  # Supprimez "base" ou mettez-le à "."
  base = "."                    # ← Changé de "test_backend" à "."
  command = "echo 'Pas de build nécessaire'"
  publish = "test_backend"      # ← Le dossier qui contient vraiment vos fichiers

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/*"
  to = "/in.html"
  status = 200 