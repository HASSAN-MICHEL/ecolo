


<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoCollect - Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #f8faf8;
            --foreground: #1a1e1a;
            --card: #ffffff;
            --primary: #2d8a5e;
            --primary-foreground: #ffffff;
            --secondary: #e8f3e8;
            --secondary-foreground: #1a5c3a;
            --muted: #f0f3f0;
            --muted-foreground: #5a655a;
            --destructive: #dc2626;
            --border: #d9e0d9;
            --ring: #2d8a5e;
            --radius: 0.75rem;
            --shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.05);
            --collecteur: #2196F3;
            --gestionnaire: #4CAF50;
            --superviseur: #9C27B0;
            --admin: #FF9800;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: var(--card);
            border-radius: 1rem;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .logo-img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--foreground);
        }

        .logo-text span {
            color: var(--primary);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--foreground);
        }

        label i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .input-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: var(--radius);
            background: var(--muted);
            border: 1px solid var(--border);
            color: var(--foreground);
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--ring);
            box-shadow: 0 0 0 3px rgba(45, 138, 94, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted-foreground);
            font-size: 1.1rem;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.2s;
            background: var(--primary);
            color: white;
            margin-top: 1rem;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(45, 138, 94, 0.2);
        }

        .message {
            padding: 1rem;
            margin-top: 1rem;
            border-radius: var(--radius);
            display: none;
        }

        .message.success {
            background: var(--secondary);
            color: var(--secondary-foreground);
            border: 1px solid var(--primary);
            display: block;
        }

        .message.error {
            background: rgba(220, 38, 38, 0.1);
            color: var(--destructive);
            border: 1px solid var(--destructive);
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--muted-foreground);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="in.html" class="logo">
            <img src="logo.jpeg" alt="EcoCollect" class="logo-img">
        </a>

        <h1><i class="fas fa-sign-in-alt" style="color: var(--primary); margin-right: 0.5rem;"></i>Connexion</h1>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email ou Téléphone</label>
                <input type="text" id="identifiant" placeholder="exemple@email.com ou 612345678" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Mot de passe</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="Votre mot de passe" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>

            <div id="message" class="message"></div>
        </form>

        <div class="links">
            <p>Pas encore de compte ? <a href="login.html">S'inscrire</a></p>
            <p><a href="index.html">← Retour à l'accueil</a></p>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = window.APP_CONFIG ? window.APP_CONFIG.API_URL : 'https://ecobackend-three.vercel.app';
        const STORAGE_KEYS = {
            TOKEN: window.APP_CONFIG?.TOKEN_KEY || 'ecocollect_token',
            USER: window.APP_CONFIG?.USER_KEY || 'ecocollect_user',
            ROLE: window.APP_CONFIG?.ROLE_KEY || 'ecocollect_role'
        };

        // Mapping des rôles vers les pages
        const ROLE_PAGES = {
            'producteur': 'producteur.html',
            'collecteur': 'collecteur.html',
            'gestionnaire': 'gestionnaire.html',
            'superviseur': 'superviseur.html',
            'admin': 'admin.html'
        };

        function togglePassword(inputId, btn) {
            const inp = document.getElementById(inputId);
            if (!inp) return;
            
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.innerHTML = inp.type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        }

        function saveAuthData(token, user, role) {
            try {
                localStorage.setItem(STORAGE_KEYS.TOKEN, token);
                localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify(user));
                localStorage.setItem(STORAGE_KEYS.ROLE, role);
                console.log(`✅ Données sauvegardées pour ${role}:`, user?.nomComplet || user?.email);
                return true;
            } catch (error) {
                console.error('❌ Erreur sauvegarde:', error);
                return false;
            }
        }

        function redirectToDashboard(role) {
            const page = ROLE_PAGES[role];
            if (page) {
                console.log(`🔄 Redirection vers ${page} (${role})`);
                window.location.href = page;
            } else {
                console.error(`❌ Page non trouvée pour le rôle: ${role}`);
                window.location.href = 'index.html';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const identifiant = document.getElementById('identifiant').value.trim();
            const motDePasse = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!identifiant || !motDePasse) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Veuillez remplir tous les champs';
                return;
            }
            
            try {
                messageDiv.className = 'message info';
                messageDiv.textContent = 'Connexion en cours...';
                messageDiv.style.display = 'block';
                
                console.log('🔍 Tentative de connexion:', identifiant);
                
                // ===== 1. ESSAYER PRODUCTEUR =====
                try {
                    const prodResponse = await fetch(`${API_URL}/api/auth/connexion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiant, motDePasse })
                    });
                    
                    const prodData = await prodResponse.json();
                    
                    if (prodResponse.ok && prodData.token) {
                        const userData = prodData.producteur || prodData.user || prodData.utilisateur || prodData;
                        
                        if (saveAuthData(prodData.token, userData, 'producteur')) {
                            messageDiv.className = 'message success';
                            messageDiv.textContent = 'Connexion producteur réussie ! Redirection...';
                            setTimeout(() => redirectToDashboard('producteur'), 1500);
                            return;
                        }
                    }
                } catch (prodError) {
                    console.log('Producteur non trouvé ou erreur:', prodError.message);
                }
                
                // ===== 2. ESSAYER COLLECTEUR =====
                try {
                    const colResponse = await fetch(`${API_URL}/api/collecteurs/connexion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiant, motDePasse })
                    });
                    
                    const colData = await colResponse.json();
                    
                    if (colResponse.ok && colData.success && colData.token) {
                        if (saveAuthData(colData.token, colData.collecteur, 'collecteur')) {
                            messageDiv.className = 'message success';
                            messageDiv.textContent = 'Connexion collecteur réussie ! Redirection...';
                            setTimeout(() => redirectToDashboard('collecteur'), 1500);
                            return;
                        }
                    }
                } catch (colError) {
                    console.log('Collecteur non trouvé ou erreur:', colError.message);
                }
                
                // ===== 3. ESSAYER GESTIONNAIRE =====
                try {
                    const gestResponse = await fetch(`${API_URL}/api/gestionnaires/connexion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiant, motDePasse })
                    });
                    
                    const gestData = await gestResponse.json();
                    
                    if (gestResponse.ok && gestData.success && gestData.token) {
                        if (saveAuthData(gestData.token, gestData.utilisateur, 'gestionnaire')) {
                            messageDiv.className = 'message success';
                            messageDiv.textContent = 'Connexion gestionnaire réussie ! Redirection...';
                            setTimeout(() => redirectToDashboard('gestionnaire'), 1500);
                            return;
                        }
                    }
                } catch (gestError) {
                    console.log('Gestionnaire non trouvé ou erreur:', gestError.message);
                }
                
                // ===== 4. ESSAYER SUPERVISEUR =====
                try {
                    const supResponse = await fetch(`${API_URL}/api/superviseurs/connexion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiant, motDePasse })
                    });
                    
                    const supData = await supResponse.json();
                    
                    if (supResponse.ok && supData.success && supData.token) {
                        if (saveAuthData(supData.token, supData.superviseur, 'superviseur')) {
                            messageDiv.className = 'message success';
                            messageDiv.textContent = 'Connexion superviseur réussie ! Redirection...';
                            setTimeout(() => redirectToDashboard('superviseur'), 1500);
                            return;
                        }
                    }
                } catch (supError) {
                    console.log('Superviseur non trouvé ou erreur:', supError.message);
                }
                
                // ===== 5. ESSAYER ADMIN (si vous avez cette route) =====
                // À décommenter si vous avez une route admin
                /*
                try {
                    const adminResponse = await fetch(`${API_URL}/api/admin/connexion`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identifiant, motDePasse })
                    });
                    
                    const adminData = await adminResponse.json();
                    
                    if (adminResponse.ok && adminData.token) {
                        if (saveAuthData(adminData.token, adminData.admin, 'admin')) {
                            messageDiv.className = 'message success';
                            messageDiv.textContent = 'Connexion admin réussie ! Redirection...';
                            setTimeout(() => redirectToDashboard('admin'), 1500);
                            return;
                        }
                    }
                } catch (adminError) {
                    console.log('Admin non trouvé ou erreur:', adminError.message);
                }
                */
                
                // ===== AUCUNE CONNEXION RÉUSSIE =====
                throw new Error('Identifiants incorrects ou compte inexistant');
                
            } catch (error) {
                console.error('❌ Erreur connexion:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = error.message || 'Erreur de connexion au serveur';
                
                // Nettoyer localStorage en cas d'échec
                localStorage.removeItem(STORAGE_KEYS.TOKEN);
                localStorage.removeItem(STORAGE_KEYS.USER);
                localStorage.removeItem(STORAGE_KEYS.ROLE);
            }
        }

        // Vérifier si déjà connecté
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem(STORAGE_KEYS.TOKEN);
            const role = localStorage.getItem(STORAGE_KEYS.ROLE);
            
            if (token && role && ROLE_PAGES[role]) {
                console.log(`🔄 Session existante: redirection vers ${ROLE_PAGES[role]}`);
                window.location.href = ROLE_PAGES[role];
            }
        });

        // Attacher l'événement au formulaire
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        
        // Exposer les fonctions globalement
        window.togglePassword = togglePassword;
    </script>
</body>
</html>
