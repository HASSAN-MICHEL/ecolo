name: Test Backend

on:
  push:
    branches: [ backend, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend
        npm install 
    
    - name: Run basic checks
      run: |
        echo "🔍 Structure vérifiée :"
        ls -la backend/
        echo ""
        echo "📁 Fichiers JavaScript :"
        find backend -name "*.js" | grep -v node_modules | head -15
    
    - name: Check syntax
      run: |
        cd backend
        npx ajv --version || echo "ajv not installed"
        # Vérifier les fichiers JS
        for file in $(find . -name "*.js" -not -path "./node_modules/*"); do
          echo "Checking $file"
          node -c "$file" && echo "✅ Syntax OK: $file"
        done 2>/dev/null || true