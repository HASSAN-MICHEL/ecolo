name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Permet un déclenchement manuel

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    
    - name: Install dependencies (backend)
      run: |
        cd backend
        npm ci --only=production
    
    - name: Create API documentation page
      run: |
        echo "📝 Création de la documentation API..."
        
        # Créer un dossier pour les pages
        mkdir -p public
        
        # Créer une page HTML simple pour l'API
        cat > public/index.html << 'HTML'
        <!DOCTYPE html>
        <html lang="fr">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>EcoCollect API - Documentation</title>
            <style>
                * { margin: 0; padding: 0; box-sizing: border-box; }
                body {
                    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
                    line-height: 1.6;
                    color: #333;
                    max-width: 1200px;
                    margin: 0 auto;
                    padding: 20px;
                    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                }
                header {
                    background: linear-gradient(90deg, #2E8B57, #3CB371);
                    color: white;
                    padding: 3rem 2rem;
                    border-radius: 15px;
                    margin-bottom: 2rem;
                    text-align: center;
                    box-shadow: 0 4px 15px rgba(46, 139, 87, 0.3);
                }
                h1 {
                    font-size: 2.8rem;
                    margin-bottom: 0.5rem;
                    background: linear-gradient(90deg, #FFD700, #FFA500);
                    -webkit-background-clip: text;
                    -webkit-text-fill-color: transparent;
                }
                .subtitle {
                    font-size: 1.2rem;
                    opacity: 0.9;
                }
                .status-badge {
                    display: inline-block;
                    background: #4CAF50;
                    color: white;
                    padding: 0.5rem 1rem;
                    border-radius: 20px;
                    font-weight: bold;
                    margin-top: 1rem;
                    animation: pulse 2s infinite;
                }
                @keyframes pulse {
                    0% { transform: scale(1); }
                    50% { transform: scale(1.05); }
                    100% { transform: scale(1); }
                }
                .container {
                    display: grid;
                    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                    gap: 2rem;
                    margin-top: 2rem;
                }
                .card {
                    background: white;
                    padding: 2rem;
                    border-radius: 12px;
                    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
                    transition: transform 0.3s, box-shadow 0.3s;
                    border-left: 5px solid #2E8B57;
                }
                .card:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
                }
                .card h3 {
                    color: #2E8B57;
                    margin-bottom: 1rem;
                    display: flex;
                    align-items: center;
                    gap: 10px;
                }
                .card h3::before {
                    content: "✓";
                    background: #2E8B57;
                    color: white;
                    width: 24px;
                    height: 24px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 14px;
                }
                .endpoint {
                    background: #f8f9fa;
                    padding: 1rem;
                    border-radius: 8px;
                    margin: 1rem 0;
                    border-left: 4px solid #3CB371;
                }
                .method {
                    display: inline-block;
                    padding: 0.3rem 0.8rem;
                    border-radius: 4px;
                    font-weight: bold;
                    font-size: 0.9rem;
                    margin-right: 0.5rem;
                }
                .get { background: #61affe; color: white; }
                .post { background: #49cc90; color: white; }
                .put { background: #fca130; color: white; }
                .delete { background: #f93e3e; color: white; }
                .url { font-family: monospace; color: #555; }
                .tech-stack {
                    display: flex;
                    flex-wrap: wrap;
                    gap: 10px;
                    margin-top: 2rem;
                }
                .tech-item {
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 0.5rem 1rem;
                    border-radius: 20px;
                    font-size: 0.9rem;
                    font-weight: bold;
                }
                footer {
                    text-align: center;
                    margin-top: 3rem;
                    padding: 2rem;
                    color: #666;
                    border-top: 1px solid #eee;
                }
                .github-link {
                    display: inline-flex;
                    align-items: center;
                    gap: 8px;
                    background: #24292e;
                    color: white;
                    padding: 0.8rem 1.5rem;
                    border-radius: 8px;
                    text-decoration: none;
                    margin-top: 1rem;
                    font-weight: bold;
                    transition: background 0.3s;
                }
                .github-link:hover {
                    background: #444;
                }
                @media (max-width: 768px) {
                    body { padding: 10px; }
                    h1 { font-size: 2rem; }
                    .container { grid-template-columns: 1fr; }
                }
            </style>
        </head>
        <body>
            <header>
                <h1>🌱 EcoCollect API</h1>
                <p class="subtitle">API REST pour la gestion intelligente des déchets et recyclage</p>
                <div class="status-badge">✅ Déployé avec succès</div>
            </header>
            
            <main>
                <section class="container">
                    <div class="card">
                        <h3>📊 API Status</h3>
                        <p><strong>Version:</strong> 1.0.0</p>
                        <p><strong>Environnement:</strong> Production</p>
                        <p><strong>Base de données:</strong> PostgreSQL + PostGIS</p>
                        <p><strong>CI/CD:</strong> GitHub Actions + Neon.tech</p>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/health</span>
                            <p>Vérifier l'état de l'API</p>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>👤 Authentication</h3>
                        <div class="endpoint">
                            <span class="method post">POST</span>
                            <span class="url">/api/auth/register</span>
                            <p>Inscription producteur</p>
                        </div>
                        <div class="endpoint">
                            <span class="method post">POST</span>
                            <span class="url">/api/auth/login</span>
                            <p>Connexion utilisateur</p>
                        </div>
                        <div class="endpoint">
                            <span class="method post">POST</span>
                            <span class="url">/api/auth/refresh</span>
                            <p>Rafraîchir token</p>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>🗑️ Déclarations</h3>
                        <div class="endpoint">
                            <span class="method post">POST</span>
                            <span class="url">/api/declarations</span>
                            <p>Créer une déclaration</p>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/declarations</span>
                            <p>Lister les déclarations</p>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/declarations/{id}</span>
                            <p>Détails d'une déclaration</p>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>📈 Dashboard</h3>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/dashboard/stats</span>
                            <p>Statistiques générales</p>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/dashboard/collectes</span>
                            <p>Collectes programmées</p>
                        </div>
                        <div class="endpoint">
                            <span class="method get">GET</span>
                            <span class="url">/api/dashboard/points</span>
                            <p>Points et récompenses</p>
                        </div>
                    </div>
                </section>
                
                <section style="margin-top: 3rem;">
                    <h2 style="color: #2E8B57; margin-bottom: 1.5rem;">🛠️ Stack Technique</h2>
                    <div class="tech-stack">
                        <span class="tech-item">Node.js</span>
                        <span class="tech-item">Express.js</span>
                        <span class="tech-item">PostgreSQL</span>
                        <span class="tech-item">PostGIS</span>
                        <span class="tech-item">JWT Auth</span>
                        <span class="tech-item">Neon.tech</span>
                        <span class="tech-item">GitHub Actions</span>
                        <span class="tech-item">GitHub Pages</span>
                    </div>
                </section>
                
                <section style="margin-top: 3rem; text-align: center;">
                    <h2 style="color: #2E8B57;">🚀 Déploiement Automatique</h2>
                    <p>Cette API est déployée automatiquement via CI/CD :</p>
                    <ol style="text-align: left; max-width: 600px; margin: 1rem auto;">
                        <li>Push sur <code>backend</code> → Tests automatiques</li>
                        <li>Tests OK → Auto-merge vers <code>main</code></li>
                        <li>Merge sur <code>main</code> → Déploiement auto</li>
                        <li>Base de données déployée sur Neon.tech</li>
                        <li>Documentation mise à jour ici</li>
                    </ol>
                </section>
            </main>
            
            <footer>
                <p>© 2024 EcoCollect - Gestion des Déchets Intelligente</p>
                <p>Développé par HASSAN avec ❤️ pour un monde plus propre</p>
                <a href="https://github.com/HASSAN-MICHEL/ecobackend" class="github-link" target="_blank">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Voir sur GitHub
                </a>
            </footer>
            
            <script>
                // Animation simple pour les cartes
                document.addEventListener('DOMContentLoaded', function() {
                    const cards = document.querySelectorAll('.card');
                    cards.forEach((card, index) => {
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(20px)';
                        
                        setTimeout(() => {
                            card.style.transition = 'opacity 0.5s, transform 0.5s';
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        }, index * 100);
                    });
                    
                    // Mettre à jour l'heure
                    function updateTime() {
                        const now = new Date();
                        const timeElement = document.getElementById('current-time');
                        if (timeElement) {
                            timeElement.textContent = now.toLocaleString('fr-FR');
                        }
                    }
                    updateTime();
                    setInterval(updateTime, 60000);
                });
            </script>
        </body>
        </html>
        HTML
        
        echo "✅ Documentation générée"
    
    - name: Create README for backend
      run: |
        echo "📘 Création du README backend..."
        cat > backend/README.md << 'MD'
        # EcoCollect Backend API
        
        ## 🚀 Déploiement Automatique
        
        Cette API est déployée automatiquement via GitHub Actions.
        
        ### Workflow CI/CD
        1. **Test** : Push sur `backend` → Tests automatisés
        2. **Merge** : Si tests OK → Auto-merge vers `main`
        3. **Déploiement** : Merge sur `main` → Déploiement auto
        4. **Documentation** : Mise à jour sur GitHub Pages
        
        ### 📊 Statistiques du déploiement
        - **Dernier déploiement** : $(date)
        - **Commit** : ${{ github.sha }}
        - **Branche** : ${{ github.ref }}
        - **État** : ✅ Déployé avec succès
        
        ### 🔗 Liens utiles
        - [Documentation API](https://hassan-michel.github.io/ecobackend/)
        - [Code source](https://github.com/HASSAN-MICHEL/ecobackend)
        - [Pipeline CI/CD](https://github.com/HASSAN-MICHEL/ecobackend/actions)
        
        ### 🗄️ Base de données
        - **Type** : PostgreSQL avec PostGIS
        - **Cloud** : Neon.tech
        - **Statut** : ✅ Connectée
        
        ---
        *Dernière mise à jour : $(date)*
        MD
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        force_orphan: true  # Garde seulement le dernier déploiement
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
    
    - name: Update deployment status
      run: |
        echo "🎉 Déploiement terminé avec succès !"
        echo ""
        echo "📊 RÉSUMÉ DU DÉPLOIEMENT :"
        echo "=========================="
        echo "✅ Documentation générée"
        echo "✅ Déployé sur GitHub Pages"
        echo "✅ README mis à jour"
        echo ""
        echo "🌐 URLs importantes :"
        echo "• Documentation : https://hassan-michel.github.io/ecobackend/"
        echo "• Repository : https://github.com/HASSAN-MICHEL/ecobackend"
        echo "• Actions : https://github.com/HASSAN-MICHEL/ecobackend/actions"
        echo ""
        echo "🔄 Prochaines étapes :"
        echo "1. Vérifiez la documentation sur GitHub Pages"
        echo "2. Testez l'API avec les endpoints documentés"
        echo "3. Continuez le développement sur la branche 'backend'"